name: CI + Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

jobs:
  # ── CI — roda em todo PR e push ──────────────────────────────
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fuelmatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Rodar migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fuelmatch_test

      - name: Lint
        run: npm run lint

      - name: Testes com cobertura
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fuelmatch_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-for-testing-only
          JWT_EXPIRATION: 15m
          JWT_REFRESH_EXPIRATION: 7d
          NODE_ENV: test

      - name: Build
        run: npm run build

  # ── Deploy — só roda no push para main ──────────────────────
  deploy:
    name: Deploy para Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
          echo "✅ Deploy iniciado no Render"
